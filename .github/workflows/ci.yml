name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3
      - name: Build
        run: ./star build
      - name: Unit tests
        run: ./star test
      - name: CI guard
        shell: bash
        run: |
          set -o pipefail
          ./star check --skip-build 2>&1 | tee /tmp/check.log || {
            grep -aE "FAIL|\[E\]|CI Guard 结果|Error|error:" /tmp/check.log | tail -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3
      - name: Configure UBSan build
        run: meson setup build-ubsan -Db_sanitize=undefined -Db_lundef=false
      - name: Build
        run: meson compile -C build-ubsan
      - name: Test
        run: meson test -C build-ubsan --print-errorlogs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install meson ninja
      - name: Build
        run: ./star build
      - name: Unit tests
        run: ./star test
      - name: CI guard
        run: ./star check --skip-build

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3
      - name: Configure ASan build
        run: meson setup build-asan -Db_sanitize=address -Db_lundef=false
      - name: Build
        run: meson compile -C build-asan
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          meson test -C build-asan --print-errorlogs 2>&1 | tee /tmp/asan.log || {
            grep -E "FAIL|ERROR: AddressSanitizer|SUMMARY|LeakSanitizer|runtime error|Aborted" /tmp/asan.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build python3 gcovr
      - name: Configure coverage build
        run: meson setup build-cov -Db_coverage=true -Dbuildtype=debug
      - name: Build
        run: meson compile -C build-cov
      - name: Test
        run: meson test -C build-cov --print-errorlogs
      - name: Coverage report
        shell: bash
        run: |
          gcovr --version
          echo "gcda files: $(find build-cov -name '*.gcda' | wc -l)"
          set -o pipefail
          gcovr -r . build-cov \
            --exclude '.*/build-cov/.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*/build-.*' \
            --print-summary 2>&1 | tee /tmp/cov.log || {
            tail -20 /tmp/cov.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
