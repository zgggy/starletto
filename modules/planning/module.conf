module {
    name = planning
    version = 0.1.0
    default_backend = native
    install_group = core
}

layout {
    config_dir = config
    component_dir = .
}

components [motion/component.conf]

dependency {
    modules [setting]
    libraries [element, method]
}

logging {
    level = INFO            # DEBUG | INFO | WARN | ERROR（只影响本模块的日志）
}
