global {
    process_group = planning
    scheduler_policy = multi_thread
    executor_threads = 4
}

component {
    name = navigation
    type = planning
    component_library = libnavigation.so
    component_class = star::planning::Refline
    config_file_path = ""
    static_link = false
    component_group = planning
    priority = 10
}

trigger {
    type = timer
    cycle_ms = 100
    task_name = navigation_update
}

readers {
    vector_map {
        topic = /star/map/vector
        type = map_msgs::msg::VectorMap
    }

    routing_request {
        topic = /star/routing/request
        type = routing_msgs::msg::RoutingRequest
    }

    vehicle_state {
        topic = /star/chassis/vehicle_status
        type = chassis_msgs::msg::Chassis
    }

    localization {
        topic = /star/localization/pose
        type = localization_msgs::msg::Localization
    }
}

writers {
    reference_line {
        topic = /star/navigation/reference_line
        msg_type = planning_msgs::msg::ReferenceLine
    }

    status {
        topic = /star/navigation/status
        msg_type = status_msgs::msg::Status
    }

    command_ack {
        topic = /star/navigation/command/ack
        msg_type = std_msgs::msg::Header
    }
}

commands {
    reroute {
        topic = /star/navigation/command/reroute
        msg_type = std_msgs::msg::Header
    }

    regenerate {
        topic = /star/navigation/command/regenerate
        msg_type = std_msgs::msg::Header
    }
}
