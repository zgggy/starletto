global {
    process_group = perception
}

component {
    name = prediction
    type = perception
    component_library = libprediction.so
    component_class = star::perception::PredictionComponent
}

trigger {
    type = timer
    cycle_ms = 50
}

writers {
    prediction {
        channel = /perception/prediction
        msg_type = star::perception::prediction::Prediction
    }
}
