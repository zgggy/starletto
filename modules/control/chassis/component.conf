global {
    process_group = control
}

component {
    name = chassis
    type = control
    component_library = libchassis.so
    component_class = star::control::Chassis
}

trigger {
    type = timer
    cycle_ms = 50
}

writers {
    chassis {
        channel = /control/chassis
        msg_type = star::control::chassis::Chassis
    }
}
