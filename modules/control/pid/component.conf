global { process_group = control }
component { name = pid_control; type = control; component_class = star::control::Control }
trigger { readers [planning_trajectory] }
readers {
    planning_trajectory {
        topic = planning.trajectory
        type = star::setting::planning::TrajectoryOutput
    }
}
writers {
    command {
        topic = control.command
        msg_type = star::setting::control::ControlCommand
        record = true
    }
}
