global { process_group = control }

component { name = pid; type = control; component_library = libpid.so; component_class = star::control::Control }

trigger {
    type = channel
    readers [planning_trajectory]
}
readers {
    planning_trajectory {
        channel = /planning/trajectory
        type = star::setting::planning::TrajectoryOutput
    }
}
writers {
    command {
        channel = /control/command
        msg_type = star::setting::control::ControlCommand
        record = true
    }
}
