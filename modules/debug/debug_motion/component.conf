global {
    process_group = debug
    scheduler_policy = multi_thread
    executor_threads = 2
}

component {
    name = debug_motion
    type = debug
    component_library = libdebug_motion.so
    component_class = star::debug::DebugMotion
    config_file_path = ""
    static_link = false
    component_group = debug
    priority = 1
}

trigger {
    type = timer
    cycle_ms = 100
    task_name = debug_motion_trigger_pub
}

writers {
    prediction {
        topic = /star/perception/prediction
        msg_type = perception_msgs::msg::Prediction
    }

    localization {
        topic = /star/localization/pose
        msg_type = localization_msgs::msg::Localization
    }

    chassis {
        topic = /star/chassis/vehicle_status
        msg_type = chassis_msgs::msg::Chassis
    }
}
