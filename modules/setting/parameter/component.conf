global {
    process_group = parameter
    scheduler_policy = multi_thread
    executor_threads = 2
}

component {
    name = parameter
    type = setting
    component_library = libparameter.so
    component_class = star::parameter::Parameter
    config_file_path = parameter/config
    static_link = false
    component_group = parameter
}

parameters {
}

trigger {
    type = timer
    cycle_ms = 1000
    task_name = parameter
}

writers {
    snapshot {
        channel = setting.parameter.snapshot
        msg_type = star::generated::setting::parameter::snapshot::ParameterSnapshot
    }
}
