module {
    name = setting
    version = 0.1.0
    default_backend = native
    install_group = core
}

layout {
    config_dir = config
    component_dir = .
}

components [config/component.conf, parameter/component.conf]

dependency {
    modules []
    libraries [common]
}

logging {
    level = INFO            # DEBUG | INFO | WARN | ERROR（只影响本模块的日志）
}
