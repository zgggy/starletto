global {
    process_group = setting
    scheduler_policy = multi_thread
    executor_threads = 1
}

component {
    name = config
    type = setting
    component_library = libconfig.so
    component_class = star::setting::Config
    config_file_path = files
    static_link = false
    component_group = setting
}

trigger {
    type = timer
    cycle_ms = 1000
    task_name = config
}

writers {
    snapshot {
        topic = setting.config.snapshot
        msg_type = star::generated::setting::config::snapshot::ConfigSnapshot
    }
}
